<?xml version="1.0" encoding="UTF-8"?>
<!-- Desktop icon for stopping the simulator. The same tile and the same
     wordmark as uas-gcs.svg so the pair reads as one set, dimmed, with a
     stop square over the bottom right corner. See uas-gcs.svg for where
     the measurements come from. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" width="256" height="256">
  <defs>
    <linearGradient id="tilestop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="1" stop-color="#282829"/>
    </linearGradient>
  </defs>

  <rect x="63" y="63" width="1128" height="1128" rx="232" fill="url(#tilestop)"/>

  <g opacity="0.55">
    <g fill="#fb0100">
      <rect x="194" y="302" width="272" height="276"/>
      <rect x="491" y="302" width="272" height="276"/>
      <rect x="788" y="302" width="272" height="276"/>
    </g>
    <g fill="#ffffff" font-family="DejaVu Sans, Verdana, Helvetica, Arial, sans-serif"
       font-weight="700" font-size="236" text-anchor="middle">
      <text x="330" y="534">U</text>
      <text x="627" y="534">A</text>
      <text x="924" y="534">V</text>
    </g>
    <text x="227" y="739" fill="#ffffff" textLength="802" lengthAdjust="spacing"
          font-family="DejaVu Sans, Verdana, Helvetica, Arial, sans-serif"
          font-weight="400" font-size="144">ACADEMY</text>
    <rect x="477" y="819" width="300" height="13" fill="#fb0100"/>
    <text x="477" y="953" fill="#ffffff" textLength="300" lengthAdjust="spacing"
          font-family="DejaVu Sans, Verdana, Helvetica, Arial, sans-serif"
          font-weight="700" font-size="123">GCS</text>
  </g>

  <!-- The stop square, over the corner so it is unmistakable at the size
       a dock or a menu actually draws these. -->
  <circle cx="1000" cy="1010" r="158" fill="#1b1b1d" stroke="#ff5252" stroke-width="20"/>
  <rect x="938" y="948" width="124" height="124" rx="16" fill="#ff5252"/>
</svg>
