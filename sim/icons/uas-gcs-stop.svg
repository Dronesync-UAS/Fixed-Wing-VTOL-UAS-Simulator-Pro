<?xml version="1.0" encoding="UTF-8"?>
<!-- Desktop icon for stopping the simulator. Same frame as uas-gcs.svg so
     the pair reads as one set, with the body replaced by a stop square. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect x="2" y="2" width="60" height="60" rx="12" fill="#10151d"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="11.5" fill="none" stroke="#1f2733"/>
  <g stroke="#2f3a4a" stroke-width="3" stroke-linecap="round">
    <line x1="20" y1="22" x2="44" y2="42"/>
    <line x1="44" y1="22" x2="20" y2="42"/>
  </g>
  <g fill="none" stroke="#2f3a4a" stroke-width="2.5">
    <circle cx="20" cy="22" r="6"/>
    <circle cx="44" cy="22" r="6"/>
    <circle cx="20" cy="42" r="6"/>
    <circle cx="44" cy="42" r="6"/>
  </g>
  <rect x="26" y="26" width="12" height="12" rx="2" fill="#ff5252"/>
</svg>
