<?xml version="1.0" encoding="UTF-8"?>
<!-- Desktop icon for the UAV Academy instructor station launcher.

     This is the UAV Academy logo with GCS added under ACADEMY, as asked
     for on 12 Oct 2026. The geometry is measured off the logo image that
     came with the request rather than eyeballed - at the 1254 px the
     image was supplied at, the three red squares run x 194-1060 and
     y 391-666, each 272 wide with a 25 px gap, ACADEMY is 802 wide with a
     105 px cap height, the tile is 1128 square inset 63, and the red is
     #fb0100 on a grey that runs about #535353 down to #39393b. The
     viewBox below is that same 1254, so those numbers are these numbers.

     The whole block is shifted up 80 px from the original to make room
     for GCS, and re-centred: it now runs y 302-953 about the tile's
     centre at 627.

     TEXT, NOT PATHS. Converting the wordmark to outlines would make it
     render identically everywhere, but it would also make this file
     unreadable and unfixable. Instead the two words carry textLength with
     lengthAdjust="spacing", so the letter spacing stretches to the
     measured width whatever font the desktop actually has - which is also
     how the real logo is set. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" width="256" height="256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#535353"/>
      <stop offset="1" stop-color="#39393b"/>
    </linearGradient>
  </defs>

  <rect x="63" y="63" width="1128" height="1128" rx="232" fill="url(#tile)"/>

  <!-- UAV: white letters on three red squares -->
  <g fill="#fb0100">
    <rect x="194" y="302" width="272" height="276"/>
    <rect x="491" y="302" width="272" height="276"/>
    <rect x="788" y="302" width="272" height="276"/>
  </g>
  <g fill="#ffffff" font-family="DejaVu Sans, Verdana, Helvetica, Arial, sans-serif"
     font-weight="700" font-size="236" text-anchor="middle">
    <text x="330" y="534">U</text>
    <text x="627" y="534">A</text>
    <text x="924" y="534">V</text>
  </g>

  <!-- ACADEMY, letter-spaced to the measured width -->
  <text x="227" y="739" fill="#ffffff" textLength="802" lengthAdjust="spacing"
        font-family="DejaVu Sans, Verdana, Helvetica, Arial, sans-serif"
        font-weight="400" font-size="144">ACADEMY</text>

  <!-- GCS, the addition. Set smaller than ACADEMY so it reads as what
       this particular application is rather than as part of the name,
       with a red rule tying it back to the squares above. -->
  <rect x="477" y="819" width="300" height="13" fill="#fb0100"/>
  <text x="477" y="953" fill="#ffffff" textLength="300" lengthAdjust="spacing"
        font-family="DejaVu Sans, Verdana, Helvetica, Arial, sans-serif"
        font-weight="700" font-size="123">GCS</text>
</svg>
